name: API CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Vercel deployment configuration
        run: |
          python -c "import tomllib; config=tomllib.load(open('../pyproject.toml', 'rb')); assert config['tool']['vercel']['entrypoint'] == 'index:app'; assert config['tool']['vercel']['scripts']['build'] == 'npm install && npm run build'; assert 'fastapi' in [item.split('>')[0].split('=')[0] for item in config['project']['dependencies']]; print('Vercel entrypoint, build command, and FastAPI dependency are configured.')"
          test "$(cat ../.python-version)" = "3.12"
          PYTHONPATH=.. python -c "import index; assert index.app.title == 'ORBITOPS Data API'; print('Vercel entrypoint imports the FastAPI app correctly.')"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - name: Run API tests
        run: pytest -q
      - name: Build production API container
        run: docker build --tag orbitops-api:ci .
