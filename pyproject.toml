[project]
name = "orbitops-space-mission"
version = "0.1.0"
description = "Source-first lunar science research website and read-only data API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "npm install && npm run build"
